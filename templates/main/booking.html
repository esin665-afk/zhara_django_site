<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Забронировать дату | ЖАРА</title>
    <!-- Твой стиль + Bootstrap -->
    <link rel="stylesheet" type="text/css" href="/static/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">

    <div class="container mt-5">
        <h1 class="text-center mb-4" style="color: #e50914;">Забронировать выступление</h1>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <form method="post" class="p-4 border rounded" style="border-color: #e50914 !important;">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="name" class="form-label">Ваше имя:</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Телефон:</label>
                        <input type="tel" class="form-control" id="phone" name="phone" required>
                    </div>

                    <div class="mb-3">
                        <label for="date" class="form-label">Дата мероприятия:</label>
                        <input type="date" class="form-control" id="date" name="event_date" required>
                    </div>

                    <!-- Кнопка в стиле btn btn-danger (красная) -->
                    <button type="submit" class="btn btn-danger w-100">Отправить заявку</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
