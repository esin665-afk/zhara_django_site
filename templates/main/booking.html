{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Забронировать дату | ЖАРА</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="booking-page">

    <!-- Фоновое фото (берем то же, что и в секции О группе) -->
    <div class="booking-bg"></div>

    <div class="booking-container">
        <h1 class="booking-title">Забронировать выступление</h1>
        
        <form method="post" class="booking-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="name">Ваше имя:</label>
                <input type="text" id="name" name="name" required placeholder="Иван Иванов">
            </div>
            
            <div class="form-group">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" name="phone" required placeholder="+7 (999) 000-00-00">
            </div>
            
            <div class="form-group">
                <label for="event_date">Дата мероприятия:</label>
                <input type="date" id="event_date" name="event_date" required>
            </div>
            
            <button type="submit" class="btn btn-submit">Отправить заявку</button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="color: #aaa; text-decoration: none; font-size: 14px;">← Вернуться на главную</a>
        </div>
    </div>

</body>
</html>
