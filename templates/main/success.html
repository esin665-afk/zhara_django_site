{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка принята | ЖАРА</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            margin: 0;
        }
        .container {
            background: #151515;
            padding: 50px;
            border-radius: 15px;
            border: 1px solid #333;
            max-width: 500px;
        }
        h1 {
            color: #e63946;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        p {
            color: #ccc;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            background-color: #e63946;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #bc2f3a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Спасибо!</h1>
        <p>Ваша заявка на выступление группы «ЖАРА» успешно сохранена. Мы свяжемся с вами в ближайшее время, чтобы обсудить детали.</p>
        <a href="/" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
